<!-- RJL home design launch -->
<section class="design-launch" aria-labelledby="design-launch-title">
  <div class="shell design-launch-card">
    <div class="design-launch-copy">
      <p class="design-launch-kicker"><span class="design-launch-new">NEW</span> Meet your new design tools</p>
      <h2 id="design-launch-title">Your fence.<br><em>Before it’s built.</em></h2>
      <p class="design-launch-description">Build your idea in 3D. Or see a new fence on a photo of your own home.</p>
      <div class="design-launch-actions">
        <a class="design-launch-button design-launch-primary" href="/fence-designer">Design in 3D <span aria-hidden="true">↗</span></a>
        <a class="design-launch-button design-launch-secondary" href="/photo-visualiser">Use my photo <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="design-launch-preview">
      <div class="design-launch-preview-bar"><span class="design-launch-live" aria-hidden="true"></span><span>Imagine the difference</span><span class="design-launch-preview-tag">PHOTO PREVIEW</span></div>
      <div class="design-launch-compare" data-design-compare>
        <img class="design-launch-before" src="/assets/examples/viz-before.webp" alt="Example house before a fence is added" width="1200" height="450" decoding="async">
        <img class="design-launch-after" src="/assets/examples/viz-after.webp" alt="The same house with a white fence and driveway gate shown as a design concept" width="1200" height="450" decoding="async">
        <span class="design-launch-image-label design-launch-label-before" aria-hidden="true">Before</span>
        <span class="design-launch-image-label design-launch-label-after" aria-hidden="true">Your idea</span>
        <span class="design-launch-divider" aria-hidden="true"><span>‹ ›</span></span>
        <input class="design-launch-range" type="range" min="0" max="100" value="55" aria-label="Reveal the fence design in the example photo" aria-valuetext="55 percent of the fence design shown">
      </div>
      <div class="design-launch-preview-footer"><span>↔ Drag to reveal</span><small>Example design concept</small></div>
    </div>
  </div>
</section>
<!-- /RJL home design launch -->
