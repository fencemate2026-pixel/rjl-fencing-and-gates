name: Website quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate public pages, links and asset versions
        run: python3 tools/audit_site.py
      - name: Check lead capture, service matching, AR and AI quotas
        run: npm test
