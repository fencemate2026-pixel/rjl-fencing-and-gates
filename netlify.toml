# RJL Fencing and Gates - static site (no build step).
# Pages are plain HTML in /site. Edit them directly; tools/ holds the
# conversion script and the browser test used to verify the site.
[build]
  publish = "site"
  command = "echo 'static site - no build'"

# Duplicate hosts -> the one official address (avoids duplicate content in Google).
[[redirects]]
  from = "https://rjlfencingandgates.netlify.app/*"
  to = "https://www.rjlfencingandgates.com.au/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://main--rjlfencingandgates.netlify.app/*"
  to = "https://www.rjlfencingandgates.com.au/:splat"
  status = 301
  force = true

# Retired page addresses from earlier versions of the site.
[[redirects]]
