# WebAssembly is confined to the same-origin object-removal worker.
[[headers]]
  for = "/assets/photo-visualiser-ai.js"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'"

